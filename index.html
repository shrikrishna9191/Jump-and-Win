// ---- Vibration (works on most Android phones in Chrome) ----
function buzz(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// ---- Sound: jazzy guitar-style music + effects ----
let audioCtx = null;
let musicOn = true;
let musicTimer = null;
let stepIndex = 0;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// A plucked string: triangle wave with a fast attack and a gentle decay
function pluck(freq, when, dur, vol) {
  const ac = getAudio();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(vol, when + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(when);
  osc.stop(when + dur + 0.05);
}

// Jazz progression ii-V-I-vi: Dm7, G7, Cmaj7, Am7
// Each chord: bass note + four chord tones (Hz)
const JAZZ = [
  { bass: 73.42,  tones: [220.00, 261.63, 329.63, 349.23] }, // Dm7
  { bass: 98.00,  tones: [196.00, 246.94, 293.66, 349.23] }, // G7
  { bass: 65.41,  tones: [196.00, 246.94, 329.63, 392.00] }, // Cmaj7
  { bass: 110.00, tones: [196.00, 261.63, 329.63, 392.00] }  // Am7
];
// Swing feel: long-short beats. 8 steps per chord.
// Each step: [what to play, delay until next step in seconds]
const SWING = [
  ['bass', 0.34], ['chord', 0.22], ['tone0', 0.34], ['tone2', 0.22],
  ['bass', 0.34], ['tone1', 0.22], ['tone3', 0.34], ['tone2', 0.22]
];

function scheduleMusic() {
  if (!musicOn) return;
  const ac = getAudio();
  const chord = JAZZ[Math.floor(stepIndex / SWING.length) % JAZZ.length];
  const step = SWING[stepIndex % SWING.length];
  const now = ac.currentTime + 0.05;
  const what = step[0];
  if (what === 'bass') {
    pluck(chord.bass, now, 0.7, 0.28);
  } else if (what === 'chord') {
    chord.tones.forEach((f, i) => pluck(f, now + i * 0.015, 0.9, 0.09));
  } else {
    const idx = parseInt(what.replace('tone', ''));
    pluck(chord.tones[idx] * 2, now, 0.6, 0.14);
  }
  stepIndex++;
  musicTimer = setTimeout(scheduleMusic, step[1] * 1000);
}

function startMusic() {
  if (musicTimer || !musicOn) return;
  scheduleMusic();
}
function stopMusic() {
  clearTimeout(musicTimer);
  musicTimer = null;
}

musicBtn.addEventListener('click', () => {
  musicOn = !musicOn;
  musicBtn.textContent = 'Music: ' + (musicOn ? 'ON' : 'OFF');
  musicBtn.style.background = musicOn ? '#4caf50' : '#777';
  if (musicOn) startMusic(); else stopMusic();
});

function jumpSound() {
  if (!musicOn) return;
  const ac = getAudio();
  pluck(523.25, ac.currentTime, 0.25, 0.25);
  pluck(659.25, ac.currentTime + 0.06, 0.25, 0.2);
}

function crashSound() {
  if (!musicOn) return;
  const ac = getAudio();
  pluck(110, ac.currentTime, 0.6, 0.35);
  pluck(82.41, ac.currentTime + 0.08, 0.7, 0.3);
}
